name: release-binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build packaged executable
        shell: pwsh
        run: |
          .\tools\build_windows.ps1 -BundleChromium

      - name: Verify packaged executable
        shell: pwsh
        run: |
          .\tools\verify.ps1 -UseBinary -RunNetworkSmoke

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep_read-windows-x64
          path: dist/deep_read-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "dist\deep_read-windows-x64.zip"
          $title = $tag
          $notes = "Windows binary for deep-read-web."

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset --title $title --notes $notes
          }
