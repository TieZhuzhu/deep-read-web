name: release-binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-binary:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build packaged executable
        shell: pwsh
        run: |
          .\tools\build_windows.ps1 -Flavor small

      - name: Verify small packaged executable
        shell: pwsh
        run: |
          .\tools\verify.ps1 -UseBinary -RunNetworkSmoke

      - name: Build full packaged executable
        shell: pwsh
        run: |
          .\tools\build_windows.ps1 -Flavor full

      - name: Verify full packaged executable
        shell: pwsh
        run: |
          .\tools\verify.ps1 -UseBinary -RunNetworkSmoke -Browser chromium

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-read-web-windows-binaries
          path: |
            dist/deep_read-windows-x64.zip
            dist/deep_read-windows-x64-with-chromium.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "dist\deep_read-windows-x64.zip",
            "dist\deep_read-windows-x64-with-chromium.zip"
          )
          $title = $tag
          $notes = @"
          Windows binaries for deep-read-web.

          Assets:
          - deep_read-windows-x64.zip: minimal package, prefers system Edge/Chrome, smallest download
          - deep_read-windows-x64-with-chromium.zip: full package, includes Playwright Chromium fallback
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          }
          else {
            gh release create $tag $assets --title $title --notes $notes
          }
